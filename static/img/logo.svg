<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Shadow -->
  <path d="M 60 8 L 102 24 C 102 68, 76 98, 60 112 C 44 98, 18 68, 18 24 Z" fill="rgba(0,0,0,0.25)" />
  
  <!-- Outer Shield Main -->
  <path d="M 60 10 L 100 25 C 100 66, 75 95, 60 108 C 45 95, 20 66, 20 25 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner Shield Accent Line -->
  <path d="M 60 18 L 92 30 C 92 62, 72 87, 60 98 C 48 87, 28 62, 28 30 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />

  <!-- Biometric Fingerprint Ridges (Stylized) -->
  <path d="M 50 48 A 12 12 0 0 1 70 48" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
  <path d="M 45 54 A 18 18 0 0 1 75 54" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
  <path d="M 42 61 A 23 23 0 0 1 78 61" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
  <path d="M 44 68 A 20 20 0 0 1 76 68" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <path d="M 52 75 A 10 10 0 0 1 68 75" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  
  <!-- Center Biometric Core Dot -->
  <circle cx="60" cy="50" r="2.5" fill="#F59E0B" />

  <!-- Emerald Green Verification Checkmark -->
  <path d="M 48 62 L 57 71 L 76 49" fill="none" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
