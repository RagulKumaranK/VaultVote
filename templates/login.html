<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VaultVote</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body, button, input, select, textarea {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.48), rgba(15, 23, 42, 0.68)),
                  url("{{ url_for('static', filename='img/parliament_vote_bg.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .login-card {
      width: 100%;
      max-width: 820px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      overflow: hidden;
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff9933 0%, #ff9933 33.3%, #ffffff 33.3%, #ffffff 66.6%, #138808 66.6%, #138808 100%);
      z-index: 10;
    }

    .login-left {
      padding: 3rem 2.8rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right {
      background: #f8fafc;
      border-left: 1px solid #e2e8f0;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .eci-logo {
      width: 220px;
      max-width: 90%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.08));
      margin-bottom: 1.4rem;
    }

    .form-control {
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-login {
      background: #1e3a8a;
      color: #ffffff;
      font-weight: 600;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #0f172a;
      color: #ffffff;
    }

    @media (max-width: 767.98px) {
      .login-right {
        border-left: none;
        border-top: 1px solid #e2e8f0;
        padding: 2rem 1.5rem;
      }

      .login-left {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="row g-0">

      <!-- LEFT SIDE: LOGIN FORM -->
      <div class="col-12 col-md-6 login-left">
        <div class="mb-4">
          <img src="{{ url_for('static', filename='img/vaultvote_logo.png') }}" alt="VaultVote"
            style="max-height: 62px; max-width: 270px; object-fit: contain;">
          <p class="text-muted small mt-2 mb-0">Smart Biometric Voting System</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 mb-3" role="alert">
          {{ message }}
          <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
          <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required
              autofocus placeholder="Enter username">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
            <input type="password" class="form-control" id="password" name="password" required
              placeholder="Enter password">
          </div>

          <button type="submit" class="btn btn-login w-100">
            Sign In
          </button>

          <div class="text-center mt-3">
            <a href="{{ url_for('voting_portal') }}" class="small text-decoration-none text-muted">
              <i class="bi bi-arrow-left me-1"></i> Return to Voting Kiosk
            </a>
          </div>
        </form>
      </div>

      <!-- RIGHT SIDE: ELECTION COMMISSION LOGO -->
      <div class="col-12 col-md-6 login-right">
        <img src="{{ url_for('static', filename='img/eci_emblem_hd.png') }}" alt="Election Commission of India"
          class="eci-logo">
        <h4 class="fw-bold text-dark mb-1">भारत निर्वाचन आयोग</h4>
        <div class="text-muted small fw-semibold">Election Commission of India</div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
